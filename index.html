<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcuticon" type="image/x-icon" href="favicon.png">
    <link rel="apple-touch-icon" sizes="180x180" href="favicon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="交流会登録フォーム">
    <link rel="icon" href="favicon.png">
    <title>交流会登録フォーム</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: "ヒラギノ角ゴ Pro W3", "Hiragino Kaku Gothic Pro", "メイリオ", Meiryo, Osaka, Arial, Helvetica, Verdana, sans-serif;
            background-color: #f7f9fb;
            margin: 0px;
        }
        .main-container {
            width: 100%;
            margin-left: auto;
            margin-right: auto;
            background-color: #ffffff;
            border-radius: 4px;
            padding: 1.5rem;
        }
        .header-title {
            font-size: 24px;
            font-weight: 700;
            color: #505050;
            margin-bottom: 10px;
            border-bottom-width: 1px;
            padding-bottom: 5px;
        }
        .owner-box {
            margin-bottom: 10px;
            padding: 1rem;
            background-color: #DCFCE7;
            border-radius: 4px;
        }
        .owner-label {
            font-size: 14px;
            font-weight: 600;
            color: #16A34A;
            margin-bottom: 0.25rem;
        }
        .owner-id-wrapper {
            display: flex;
            align-items: center; 
            justify-content: space-between; 
            gap: 1rem; 
        }
        .owner-id {
            flex-grow: 1;
            min-width: 0; 
            font-size: 18px;
            font-weight: 800;
            color: #505050;
            overflow: hidden; 
            display: block;
        }
        .owner-id-sub {
            display: block;
            font-size: 12px;
            font-weight: 500;
            color: #808080;
            margin-top: 2px;
        }
        .event-cards-container {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        .event-card {
            border: 1px solid #cccccc;
            border-radius: 4px;
        }
        .card-summary {
            display: flex;
            justify-content: space-between; 
            align-items: center; 
            padding: 10px 5px;
            cursor: pointer;
            outline: none;
        }
        .card-title-wrapper {
            display: flex;
            flex-direction: column; 
            justify-content: center;
            border-left: 3px solid #B3FF52; 
            padding-left: 10px;
            margin-left: 5px;
            color: #505050;
            max-width: 77%;
        }
        .card-date-line {
            font-size: 12px; 
            font-weight: 500;
            color: #808080; 
        }
        .card-name-line {
            font-size: 14px; 
            font-weight: 700;
            color: #505050; 
        }
        
        .status-area {
            font-size: 12px;
            font-weight: bold;
            display: flex;
            align-items: center; 
            padding-right: 10px;
        }
        .chevron-icon-wrapper {
            color: #cccccc;
            transition: transform 200ms ease-in-out;
        }
        .event-card[open] .chevron-icon-wrapper {
            transform: rotate(180deg);
        }
        .card-content {
            padding: 10px;
            border-top: 1px dashed #cccccc;
            background-color: #ffffff;
            display: grid;
            grid-template-columns: 1fr;
            gap: 1rem;
        }
        .label-text {
            display: block;
            font-size: 12px;
            padding-left: 10px;
            font-weight: bold;
            color: #808080;
        }
        .input-field {
            margin-top: 0.25rem;
            display: block; 
            width: 100%; 
            padding-left: 10px;
            border: 1px solid #d1d5db;
            border-radius: 4px;
            transition: all 150ms ease-in-out; 
            background-color: #ffffff;
            font-size: 16px;
            color: #505050;
            height: 36px;
            text-align: left;
        }
        .input-field:focus {
            outline: 2px solid transparent;
            outline-offset: 2px;
            border-color: #6beb71; 
        }
        
        .input-field[type="date"],
        .input-field[type="time"] {
            -webkit-appearance: none; 
            appearance: none;
            font-size: 16px; 
            padding-left: 10px;   
            width: 100%;
            box-sizing: border-box; 
            height: 36px;
        }
        
        select.input-field {
            -webkit-appearance: none; 
            appearance: none;
            background-image: none; 
            padding-left: 10px; 
            height: 36px; 
        }
        
        .input-field::-ms-clear {
            display: none;
        }

        .button-group {
            display: flex;
            justify-content: center;
            gap: 1rem;
            padding-top: 1rem;
            border-top: 1px solid #e5e7eb;
            margin-top: 1rem;
        }
        .clear-button {
            padding: 0.5rem 1rem;
            font-size: 0.875rem;
            font-weight: 500;
            color: #374151;
            background-color: #e5e7eb;
            border-radius: 4px;
            transition: background-color 150ms; 
            width: 80px;
            border: 1px solid #cccccc;
        }
        .clear-button:hover {
            background-color: #d1d5db;
        }
        .register-button {
            padding: 0.5rem 1rem;
            font-size: 0.875rem;
            font-weight: 500;
            color: #505050;
            background-color: #B3FF52;
            border-radius: 4px;
            transition: background-color 150ms; 
            width: 80px;
            border: 1px solid #dcdcdc;
        }
        .register-button:hover {
            background-color: #B3FF52;
        }
        .register-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .delete-button {
            padding: 0.5rem 1rem;
            font-size: 0.875rem;
            font-weight: 500;
            color: #ffffff;
            background-color: #f06163;
            border-radius: 4px;
            transition: background-color 150ms; 
            border-color:#505050;
            border: 1px;
            width: 80px;
            border: 1px solid #dcdcdc;
        }
        .delete-button:hover {
            background-color: #f06163;
        }
        .message-box {
            padding: 0.75rem;
            border-radius: 4px;
            font-size: 0.875rem;
        }
        .message-box.hidden {
            display: none;
        }
        details[open] summary ~ * {
            animation: sweep .3s ease-in-out;
        }
        @keyframes sweep {
            0%    {opacity: 0;
                transform: translateY(-10px)}
            100%  {opacity: 1;
                transform: translateY(0)}
        }
        .hidden-url-box {
            display: none;
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const supabaseUrl = 'https://yyrsscvofuoufkujetgf.supabase.co';
    </script>
</head>
<body class="page-wrapper">

    <div class="main-container">
        <h1 class="header-title">交流会登録フォーム</h1>
        
        <div class="owner-box">
            <p class="owner-label">主催者アカウント</p>
            <div class="owner-id-wrapper">
                <div class="flex-grow min-w-0">
                    <span id="ownerIdDisplay" class="owner-id"></span>
                    <span id="ownerIdSub" class="owner-id-sub"></span>
                </div>
            </div>
        </div>
        
        <div id="eventForm">
            <div id="eventCards" class="event-cards-container">
                <script>
                    const cardIndices = [1, 2, 3, 4, 5];
                    const cardSymbols = ['①', '②', '③', '④', '⑤'];
                    
                    cardIndices.forEach((num, index) => {
                        document.write(`
                        <details id="card_${num}" class="event-card group">
                            <summary class="card-summary">
                                <div class="card-title-wrapper">
                                    <div class="card-date-line" id="dateDisplay_${num}">交流会${cardSymbols[index]}</div>
                                    <div class="card-name-line" id="nameDisplay_${num}"></div>
                                </div>
                                <div class="status-area">
                                    <span id="statusDisplay_${num}" class="status-text"></span> 
                                    <span class="chevron-icon-wrapper">
                                        <svg class="chevron-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                                    </span>
                                </div>
                            </summary>
                            <div class="card-content">
                                <input type="hidden" name="eventNum_${num}" value="${num}">
                                <div>
                                    <label for="type_${num}" class="label-text">イベントタイプ</label>
                                    <select id="type_${num}" name="type_${num}" class="input-field">
                                        <option value="交流会" selected>交流会</option>
                                        <option value="練習会">練習会</option>
                                        <option value="非公式大会">非公式大会</option>
                                        <option value="S1【予定】">S1【予定】</option>
                                        <option value="アンバサダー【予定】">アンバサダー【予定】</option>
                                    </select>
                                </div>
                                <div>
                                    <label for="name_${num}" class="label-text">イベント名</label>
                                    <input type="text" id="name_${num}" name="name_${num}" required class="input-field">
                                </div>
                                <div>
                                    <label for="date_${num}" class="label-text">日付</label>
                                    <input type="date" id="date_${num}" name="date_${num}" required class="input-field">
                                </div>
                                <div>
                                    <label for="time_${num}" class="label-text">時刻</label>
                                    <input type="time" id="time_${num}" name="time_${num}" class="input-field">
                                </div>
                                <div>
                                    <label for="location_${num}" class="label-text">会場</label>
                                    <input type="text" id="location_${num}" name="location_${num}" class="input-field">
                                </div>
                                <div>
                                    <label for="address_${num}" class="label-text">住所</label>
                                    <input type="text" id="address_${num}" name="address_${num}" class="input-field" placeholder="必ず都道府県から入力して下さい">
                                </div>
                                <div>
                                    <label for="capacity_${num}" class="label-text">定員</label>
                                    <input type="text" id="capacity_${num}" name="capacity_${num}" placeholder="例: 30名" class="input-field">
                                </div>
                                <div>
                                    <label for="fee_${num}" class="label-text">参加費</label>
                                    <input type="text" id="fee_${num}" name="fee_${num}" value="参加費：無料" class="input-field">
                                </div>
                                <div>
                                    <label for="eligibility_${num}" class="label-text">参加資格</label>
                                    <select id="eligibility_${num}" name="eligibility_${num}" class="input-field">
                                        <option value="6歳以上(オープン)" selected>6歳以上(オープン)</option>
                                        <option value="12歳以下(レギュラー)">12歳以下(レギュラー)</option>
                                        <option value="15歳以下(中学生以下)">15歳以下(中学生以下)</option>
                                        <option value="17歳以下">17歳以下</option>
                                        <option value="18歳以上">18歳以上</option>
                                        <option value="20歳以上">20歳以上</option>
                                    </select>
                                </div>
                                <div>
                                    <label for="entry_${num}" class="label-text">当日受付</label>
                                    <select id="entry_${num}" name="entry_${num}" class="input-field">
                                        <option value="当日受付:なし" selected>当日受付:なし</option>
                                        <option value="当日受付:あり">当日受付:あり</option>
                                    </select>
                                </div>
                                <div>
                                    <label for="details_${num}" class="label-text">募集方法とイベント内容</label>
                                    <textarea id="details_${num}" name="details_${num}" rows="8" class="input-field" style="height: 200px;"></textarea>
                                </div>
                                <div>
                                    <label for="linkType_${num}" class="label-text">エントリー用リンク</label>
                                    <select id="linkType_${num}" name="linkType_${num}" class="input-field" onchange="toggleLinkInput(${num})">
                                        <option value="x_account" selected>Xアカウントへのリンク(DMでの受付の場合)</option>
                                        <option value="custom_url">エントリーサイトのURL</option>
                                        <option value="none">リンク無し(当日受付のみの場合など)</option>
                                    </select>
                                    <div id="urlInputContainer_${num}" class="hidden-url-box mt-2">
                                        <input type="text" id="linkUrl_${num}" name="linkUrl_${num}" class="input-field" placeholder="https://...">
                                    </div>
                                </div>
                                <div id="cardMessage_${num}" class="message-box hidden" role="alert"></div>
                                <div class="button-group">
                                    <button type="button" onclick="deleteEvent(${num})" id="deleteButton_${num}" class="delete-button">削除</button>
                                    <button type="button" onclick="clearCard(${num}, true)" class="clear-button">Clear</button>
                                    <button type="button" onclick="registerEvent(${num})" id="registerButton_${num}" class="register-button">登録</button>
                                </div>
                            </div>
                        </details>
                        `);
                    });
                </script>
            </div>
            
            <div style="text-align: center; margin-top: 30px; margin-bottom: 20px;">
                <a href="#" 
                id="beyCalendarLink"
                target="_blank" 
                rel="noopener noreferrer"
                style="font-size: 16px; font-weight: 700; color: #1e40af; text-decoration: underline;">
                    最新のBEYカレンダーを確認はこちらから 
                </a>
            </div>
            
        </div>
    </div>

<script type="module">
    const supabase = window.supabase.createClient(
        supabaseUrl,
        'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl5cnNzY3ZvZnVvdWZrdWpldGdmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjQwMzIxMjksImV4cCI6MjA3OTYwODEyOX0.mNPIAGFKhJ65dsSllBprGYk3yZfnJXfYmDcdljW8xA4'
    );    
    
    const eventNums = [1, 2, 3, 4, 5]; 
    const initialCheckFlgs = {};
    const initialData = {}; 
    const urlParams = new URLSearchParams(window.location.search);
    const urlId = urlParams.get('id');
    const CURRENT_OWNER_ID = urlId ? urlId : '@TEST'; 
    const TYPE_COLORS = {
        'S1【予定】': '#97f3f3',
        'アンバサダー【予定】': '#97f3f3',
        'default': '#A0FA8D' 
    };
    
    document.getElementById('ownerIdDisplay').textContent = CURRENT_OWNER_ID; 
    document.getElementById('ownerIdSub').textContent = CURRENT_OWNER_ID;
    document.getElementById('ownerIdSub').style.display = 'none';
    
    const defaultFee = '参加費：無料';

    // URLの id からXアカウントの表示名（アカウント名）を取得して主表示に、
    // 元のidは1段下に小さいフォントで表示する
    async function loadOwnerDisplayName() {
        if (!urlId) return; // idが未指定(@TEST起動)の場合は従来通りIDのみ表示
        const mainDisplay = document.getElementById('ownerIdDisplay');
        const subDisplay = document.getElementById('ownerIdSub');
        try {
            const cleanId = CURRENT_OWNER_ID.replace('@', '');
            const res = await fetch(`${supabaseUrl}/functions/v1/get-x-name?id=${encodeURIComponent(cleanId)}`);
            if (!res.ok) throw new Error(`status ${res.status}`);
            const json = await res.json();
            if (json && json.name) {
                mainDisplay.textContent = json.name;
                subDisplay.textContent = CURRENT_OWNER_ID;
                subDisplay.style.display = 'block';
            } else {
                throw new Error('アカウント名が取得できませんでした');
            }
        } catch (error) {
            console.error('Xアカウント名の取得に失敗しました:', error);
            // 失敗時は従来通りID表示のみ（主表示にIDが出ているのでサブ表示は隠す）
            mainDisplay.textContent = CURRENT_OWNER_ID;
            subDisplay.style.display = 'none';
        }
    }
    loadOwnerDisplayName();

    // UI制御関数をグローバルに
    window.toggleLinkInput = function(num) {
        const type = document.getElementById(`linkType_${num}`).value;
        const container = document.getElementById(`urlInputContainer_${num}`);
        if (type === 'custom_url') {
            container.style.display = 'block';
        } else {
            container.style.display = 'none';
        }
    }

    function updateCardBorderColor(num) {
        const typeSelect = document.getElementById(`type_${num}`);
        const cardTitleWrapper = document.querySelector(`#card_${num} .card-title-wrapper`);
        
        if (typeSelect && cardTitleWrapper) {
            const selectedType = typeSelect.value;
            const color = TYPE_COLORS[selectedType] || TYPE_COLORS['default'];
            cardTitleWrapper.style.borderColor = color;
        }
    }

    function setupCardTypeListeners() {
        eventNums.forEach(num => {
            const typeSelect = document.getElementById(`type_${num}`);
            if (typeSelect) {
                typeSelect.addEventListener('change', () => {
                    updateCardBorderColor(num);
                    updateStatusDisplay(num); 
                });
                updateCardBorderColor(num);
            }
        });
    }

    function showMessage(num, text, isError = false, isWarning = false) {
        const messageDiv = document.getElementById(`cardMessage_${num}`);
        if (!messageDiv) return;
        messageDiv.innerHTML = text;
        messageDiv.classList.remove('hidden', 'bg-red-100', 'text-red-700', 'bg-green-100', 'text-green-700', 'bg-yellow-100', 'text-yellow-700');
        if (isError) messageDiv.classList.add('bg-red-100', 'text-red-700');
        else if (isWarning) messageDiv.classList.add('bg-yellow-100', 'text-yellow-700');
        else messageDiv.classList.add('bg-green-100', 'text-green-700');
    }

    async function sendEmailNotification(type, num, data = null) {
        const emailApiUrl = `${supabaseUrl}/functions/v1/resend-email`;
        const recipient = 'beymet.channel@gmail.com';
        try {
            await fetch(emailApiUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    ownerId: CURRENT_OWNER_ID,
                    eventNum: num,
                    changeType: type,
                    eventData: data, 
                    recipient: recipient,
                })
            });
        } catch (error) { console.error('メール通知送信エラー:', error); }
    }
    
    function areRequiredFieldsFilled(num) {
        const nameInput = document.getElementById(`name_${num}`);
        const dateInput = document.getElementById(`date_${num}`);
        return nameInput.value.trim() !== '' && dateInput.value.trim() !== '';
    }

    function updateStatusDisplay(num) {
        const isChecked = initialCheckFlgs[num];
        const isRequiredFilled = areRequiredFieldsFilled(num);
        const statusDisplay = document.getElementById(`statusDisplay_${num}`);
        const nameValue = document.getElementById(`name_${num}`).value.trim();
        const dateValue = document.getElementById(`date_${num}`).value.trim();
        const dateDisplay = document.querySelector(`#card_${num} summary .card-date-line`); 
        const nameDisplay = document.querySelector(`#card_${num} summary .card-name-line`); 
        const defaultTitle = `交流会${['①', '②', '③', '④', '⑤'][num - 1]}`;

        if (dateDisplay && nameDisplay) {
            if (nameValue !== '' && dateValue !== '') {
                const dateObj = new Date(dateValue);
                if (!isNaN(dateObj.getTime())) { 
                    dateDisplay.textContent = `${dateObj.getMonth() + 1}/${dateObj.getDate()}`;
                    nameDisplay.textContent = nameValue; 
                } else {
                    dateDisplay.textContent = defaultTitle; nameDisplay.textContent = '';
                }
            } else {
                dateDisplay.textContent = defaultTitle; nameDisplay.textContent = '';
            }
        }
        if (!statusDisplay) return;

        let isPastDate = false;
        if (dateValue) {
            const eventDate = new Date(dateValue);
            const today = new Date(); today.setHours(0, 0, 0, 0); 
            const typeValue = document.getElementById(`type_${num}`) ? document.getElementById(`type_${num}`).value : '';

            if (typeValue === 'S1【予定】' || typeValue === 'アンバサダー【予定】') {
                // S1【予定】・アンバサダー【予定】は、公式ページに30日前掲載されるため
                // イベント日付基準で31日前を過ぎたら掲載終了扱いにする
                const cutoffDate = new Date(eventDate);
                cutoffDate.setDate(cutoffDate.getDate() - 31);
                if (today >= cutoffDate) isPastDate = true;
            } else {
                // 従来通り、今日基準で1日前(=前日)を過ぎたら掲載終了扱い
                const yesterday = new Date(today); yesterday.setDate(yesterday.getDate() - 1);
                if (eventDate <= yesterday) isPastDate = true;
            }
        }
        
        if (isPastDate && isChecked) statusDisplay.innerHTML = '<span class="text-red-600">🔴掲載終了</span>';
        else if (isChecked) statusDisplay.innerHTML = '<span class="text-green-600">🟢掲載中</span>';
        else statusDisplay.innerHTML = isRequiredFilled ? '<span class="text-yellow-600">🟡未掲載</span>' : '<span class="text-red-600">🔴未入力</span>';
    }

    function setupStatusListeners() {
        eventNums.forEach(num => {
            const cardDiv = document.querySelector(`#card_${num}`);
            if (cardDiv) {
                cardDiv.querySelectorAll('input, select, textarea').forEach(input => {
                    input.addEventListener('input', () => updateStatusDisplay(num));
                    input.addEventListener('change', () => updateStatusDisplay(num));
                });
                updateStatusDisplay(num);
            }
        });
    }

    function getEventData(num) {
        // エントリー用リンクの判定ロジック
        const linkType = document.getElementById(`linkType_${num}`).value;
        let finalLink = '';
        if (linkType === 'x_account') {
            const cleanId = CURRENT_OWNER_ID.replace('@', '');
            finalLink = `https://x.com/${cleanId}`;
        } else if (linkType === 'custom_url') {
            finalLink = document.getElementById(`linkUrl_${num}`).value || '';
        } else {
            finalLink = '';
        }

        return {
            owner: CURRENT_OWNER_ID,
            eventNum: num,
            date: document.getElementById(`date_${num}`).value || null,
            name: document.getElementById(`name_${num}`).value || null,
            time: document.getElementById(`time_${num}`).value || null,
            location: document.getElementById(`location_${num}`).value || null,
            fee: document.getElementById(`fee_${num}`).value, 
            type: document.getElementById(`type_${num}`).value || '交流会',
            capacity: document.getElementById(`capacity_${num}`).value || null,
            entry: document.getElementById(`entry_${num}`).value || '当日受付:なし',
            eligibility: document.getElementById(`eligibility_${num}`).value || '6歳以上(オープン)',
            address: document.getElementById(`address_${num}`).value || null,
            details: document.getElementById(`details_${num}`).value || null,
            link: finalLink // 保存するカラム
        };
    }

    function formatDataForComparison(data) {
        const formatted = {};
        for (const key in data) {
            if (key === 'owner' || key === 'eventNum') continue;
            let value = data[key];
            if (['date','name','time','location','address','capacity','details','fee','link'].includes(key)) {
                formatted[key] = (value === null || value === '') ? null : value.toString().trim();
            } else {
                formatted[key] = value;
            }
        }
        return formatted;
    }

    function checkIfDataChanged(num) {
        const currentData = getEventData(num);
        const initial = initialData[num];
        if (!initial) {
             return Object.values(formatDataForComparison(currentData)).some(val => val !== null && val !== '参加費：無料' && val !== '当日受付:なし' && val !== '6歳以上(オープン)');
        }
        const currentFormatted = formatDataForComparison(currentData);
        const initialFormatted = formatDataForComparison(initial);
        delete initialFormatted.checkFlg;
        return JSON.stringify(currentFormatted) !== JSON.stringify(initialFormatted);
    }
    
    function validateEventData(data) {
        const errors = [];
        if (!data.name) errors.push(`「イベント名」が未入力です。`);
        if (!date) errors.push(`「日付」が未入力です。`); // 既存の判定
        
        // 住所のチェックロジックを更新
        const prefectures = ["北海道","青森県","岩手県","宮城県","秋田県","山形県","福島県","茨城県","栃木県","群馬県","埼玉県","千葉県","東京都","神奈川県","新潟県","富山県","石川県","福井県","山梨県","長野県","岐阜県","静岡県","愛知県","三重県","滋賀県","京都府","大阪府","兵庫県","奈良県","和歌山県","鳥取県","島根県","岡山県","広島県","山口県","徳島県","香川県","愛媛県","高知県","福岡県","佐賀県","長崎県","熊本県","大分県","宮崎県","鹿児島県","沖縄県"];
        
        const trimmedAddress = data.address ? data.address.trim() : '';
        
        if (!trimmedAddress) {
            // 未入力の場合のエラーメッセージ
            errors.push(`「住所」が未入力です。`);
        } else if (!prefectures.some(p => trimmedAddress.startsWith(p))) {
            // 都道府県から始まっていない場合のエラーメッセージ
            errors.push(`住所は必ず都道府県名から入力してください。`);
        }
    
        return errors;
    }

    window.clearCard = function(num, showConfirmation = true) {
        if (showConfirmation && !confirm(`イベント${num} の入力内容をクリアしますか？`)) return;

        const cardElement = document.getElementById(`card_${num}`);
        if (cardElement) {
            cardElement.querySelectorAll('input:not([type="hidden"]), textarea').forEach(input => {
                input.value = input.name.startsWith('fee_') ? defaultFee : '';
            });
            cardElement.querySelectorAll('select').forEach(select => {
                if (select.name.startsWith('type_')) select.value = '交流会';
                else if (select.name.startsWith('eligibility_')) select.value = '6歳以上(オープン)';
                else if (select.name.startsWith('entry_')) select.value = '当日受付:なし';
                else if (select.name.startsWith('linkType_')) select.value = 'x_account';
            });
            window.toggleLinkInput(num);
            updateCardBorderColor(num);
            updateStatusDisplay(num); 
            if (showConfirmation) showMessage(num, `イベント${num} の入力内容をクリアしました。`, false, true);
        }
    }

    window.deleteEvent = async function(num) {
        if (!confirm(`イベント${num} をベイカレンダーから削除しますか？`)) return;
        const btn = document.getElementById(`deleteButton_${num}`);
        btn.disabled = true; btn.textContent = '削除中...';
        
        try {
            window.clearCard(num, false); 
            const dataToClear = {
                owner: CURRENT_OWNER_ID,
                eventNum: num,
                date: null, name: null, time: null, location: null, fee: '参加費:無料', 
                capacity: null, type: '交流会', entry: '当日受付:なし', eligibility: '6歳以上(オープン)',
                address: null, details: null, checkFlg: false, link: ''
            };
            const { error } = await supabase.from('EventDB').upsert([dataToClear], { onConflict: 'owner,eventNum' });
            if (error) throw error;
            
            showMessage(num, `イベント${num}を削除しました。`, false);
            initialCheckFlgs[num] = false; 
            updateStatusDisplay(num);
            initialData[num] = { ...dataToClear, checkFlg: false }; 
            setTimeout(() => {
                const cardEl = document.getElementById(`card_${num}`);
                if (cardEl) cardEl.open = false;
            }, 1200);
            await sendEmailNotification('delete', num, dataToClear);
        } catch (error) {
            showMessage(num, `削除失敗: ${error.message}`, true);
        } finally {
            btn.disabled = false; btn.textContent = '削除';
        }
    }

    window.registerEvent = async function(num) {
        const btn = document.getElementById(`registerButton_${num}`);
        btn.disabled = true; btn.textContent = '登録中...';
        const data = getEventData(num);
        const errors = validateEventData(data);
        if (errors.length > 0) {
            showMessage(num, `エラー:<ul class="list-disc ml-4">${errors.map(e => `<li>${e}</li>`).join('')}</ul>`, true);
            btn.disabled = false; btn.textContent = '登録';
            return;
        }
        if (!checkIfDataChanged(num)) {
            showMessage(num, `変更がありません。`, false, true);
            btn.disabled = false; btn.textContent = '登録';
            return;
        }
        if (!confirm(`登録してよろしいですか？`)) {
            btn.disabled = false; btn.textContent = '登録';
            return;
        }

        try {
            const { data: updated, error } = await supabase
                .from('EventDB')
                .upsert([{ ...data, checkFlg: true }], { onConflict: 'owner,eventNum' }) 
                .select().single();
            if (error) throw error;
            
            showMessage(num, `イベント${num}を更新しました。`, false);
            setTimeout(() => {
                const cardEl = document.getElementById(`card_${num}`);
                if (cardEl) cardEl.open = false;
            }, 1200);
            initialCheckFlgs[num] = updated.checkFlg;
            initialData[num] = updated; 
            updateStatusDisplay(num); 
            await sendEmailNotification('register', num, updated);
        } catch (error) {
            showMessage(num, `登録失敗: ${error.message}`, true);
        } finally {
            btn.disabled = false; btn.textContent = '登録';
        }
    }
    
    window.addEventListener('load', async () => {
        const { data: events, error } = await supabase
            .from('EventDB').select('*').eq('owner', CURRENT_OWNER_ID) 
            .in('eventNum', eventNums).order('eventNum', { ascending: true }); 

        eventNums.forEach(num => {
            const event = events ? events.find(e => e.eventNum === num) : null;
            initialCheckFlgs[num] = event ? (event.checkFlg || false) : false; 
            initialData[num] = event || null; 

            if (event) {
                document.getElementById(`type_${num}`).value = event.type || '交流会';
                document.getElementById(`name_${num}`).value = event.name || '';
                document.getElementById(`date_${num}`).value = event.date || '';
                document.getElementById(`time_${num}`).value = event.time || '';
                document.getElementById(`location_${num}`).value = event.location || '';
                document.getElementById(`fee_${num}`).value = event.fee || defaultFee;
                document.getElementById(`capacity_${num}`).value = event.capacity || '';
                document.getElementById(`eligibility_${num}`).value = event.eligibility || '6歳以上(オープン)'; 
                document.getElementById(`address_${num}`).value = event.address || '';
                document.getElementById(`entry_${num}`).value = event.entry || '当日受付:なし'; 
                document.getElementById(`details_${num}`).value = event.details || '';
                
                // linkの復元ロジック
                const linkVal = event.link || '';
                const typeSelect = document.getElementById(`linkType_${num}`);
                const urlInput = document.getElementById(`linkUrl_${num}`);
                const xUrlBase = `https://x.com/${CURRENT_OWNER_ID.replace('@', '')}`;

                if (linkVal === '') {
                    typeSelect.value = 'none';
                } else if (linkVal === xUrlBase) {
                    typeSelect.value = 'x_account';
                } else {
                    typeSelect.value = 'custom_url';
                    urlInput.value = linkVal;
                }
                window.toggleLinkInput(num);
            }
        });
        setupStatusListeners();
        setupCardTypeListeners();
        const calendarLink = document.getElementById('beyCalendarLink');
        if (calendarLink) {
            calendarLink.addEventListener('click', (e) => {
                e.preventDefault(); 
                window.open('https://beymetchannel.github.io/BeyCalendar/?ts=' + new Date().getTime(), '_blank');
            });
        }
    });
</script>
